<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Old links used "#/topic"; send them to the real page.
      if (location.hash.indexOf('#/') === 0) location.replace('/' + location.hash.slice(2).replace(/^\/+/, ''))
      // Apply the saved theme before first paint, so there is no flash.
      try {
        var t = localStorage.getItem('ai-explorer-theme')
        if (t === 'whiteprint' || t === 'blueprint') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>AI Explorer: How AI works, step by step</title>
    <meta name="description" content="Interactive, step-by-step visual explainers of how AI works, from ELIZA and search to neural networks, transformers, RAG and agents." />
    <meta name="google-site-verification" content="Mh75XEAS7-q0fUyVLOW3f7NRW54cFRmVlMPnV6n8tV8" />
    <!--seo-->
    <meta name="theme-color" content="#0b3d91" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
